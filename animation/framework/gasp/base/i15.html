<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <style>
    .box {
      width: 80px;
      height: 80px;
      background: #4285f4;
      margin: 10px;
    }
  </style>
  <script src="../js/gsap.min.js"></script>
</head>

<body>
  <div class="box"></div>
  <button id="pauseBtn">暂停动画</button>
  <button id="restartBtn">重启动画</button>
  <script>
    // 创建动画并设置id
    gsap.to(".box", {
      x: 250,
      duration: 2,
      repeat: -1,
      yoyo: true,
      id: "boxLoopAnim"
    });

    document.querySelector("#pauseBtn").onclick = () => {
      const anim = gsap.getById("boxLoopAnim");
      if (anim) anim.pause();
    }
    document.querySelector("#restartBtn").onclick = () => {
      const anim = gsap.getById("boxLoopAnim");
      if (anim) anim.restart();
    }
  </script>
</body>

</html>
