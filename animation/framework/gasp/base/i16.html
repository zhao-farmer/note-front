<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <style>
    .box {
      width: 80px;
      height: 80px;
      background: #4285f4;
      margin: 10px;
    }
  </style>
  <script src="../js/gsap.min.js"></script>
</head>

<body>
  <div class="box"></div>
  <div>当前x值：<span id="valText">0</span></div>
  <button id="readBtn">读取属性</button>
  <script>
    const box = document.querySelector(".box");
    const valText = document.querySelector("#valText");

    // 启动动画
    gsap.to(box, {
      x: 250,
      duration: 3,
      repeat: -1,
      yoyo: true
    });

    document.querySelector("#readBtn").onclick = () => {
      const x = gsap.getProperty(box, "x");
      valText.textContent = x.toFixed(2);
    }
  </script>
</body>

</html>
