<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>ReflectionFilter｜初始化数组，滑块单字段Start/End赋值</title>
  <script src="./js/pixi.js"></script>
  <script src="./js/pixi-filters.js"></script>
  <style>
    .wrap {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .panel {
      width: 380px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid #ccc;
      padding: 14px;
      border-radius: 6px;
    }

    canvas {
      border: 1px solid #ccc;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    label {
      width: 170px;
      font-size: 14px;
    }

    input[type="range"] {
      flex: 1;
    }

    .val {
      width: 75px;
      text-align: right;
      font-size: 13px;
    }

    .tip {
      font-size: 12px;
      color: #555;
      margin-top: 8px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div id="canvasWrap"></div>
    <div class="panel">
      <div class="row">
        <label>mirror 镜像反射</label>
        <input type="checkbox" id="chkMirror" checked>
        <span class="val">true</span>
      </div>
      <div class="row">
        <label>boundary 反射边界</label>
        <input type="range" min="0" max="1" step="0.01" id="inpBoundary">
        <span class="val">0.50</span>
      </div>
      <div class="row">
        <label>amplitudeStart 起始振幅</label>
        <input type="range" min="0" max="60" step="0.5" id="inpAmpStart">
        <span class="val">0.00</span>
      </div>
      <div class="row">
        <label>amplitudeEnd 结束振幅</label>
        <input type="range" min="0" max="60" step="0.5" id="inpAmpEnd">
        <span class="val">20.00</span>
      </div>
      <div class="row">
        <label>waveLengthStart 起始波长</label>
        <input type="range" min="10" max="200" step="1" id="inpWaveStart">
        <span class="val">30</span>
      </div>
      <div class="row">
        <label>waveLengthEnd 结束波长</label>
        <input type="range" min="10" max="200" step="1" id="inpWaveEnd">
        <span class="val">100</span>
      </div>
      <div class="row">
        <label>alphaStart 起始透明度</label>
        <input type="range" min="0" max="1" step="0.01" id="inpAlphaStart">
        <span class="val">1.00</span>
      </div>
      <div class="row">
        <label>alphaEnd 结束透明度</label>
        <input type="range" min="0" max="1" step="0.01" id="inpAlphaEnd">
        <span class="val">1.00</span>
      </div>
      <div class="tip">
        初始化：filter.amplitude = [s,e] 全量数组赋值<br>
        滑块oninput：使用 xxxStart / xxxEnd 单独赋值<br>
        禁止 filter.amplitude[0] = xxx 下标直接修改
      </div>
    </div>
  </div>

  <script type="module">
    const app = new PIXI.Application();
    await app.init({
      width: 345,
      height: 460,
      backgroundColor: 0x222222
    });
    document.querySelector("#canvasWrap").appendChild(app.canvas);

    const tex = await PIXI.Assets.load("./image/01.jpg");
    const sprite = PIXI.Sprite.from(tex);
    sprite.scale.set(0.5);
    app.stage.addChild(sprite);

    const reflectionFilter = new PIXI.filters.ReflectionFilter({
      mirror: false,
      boundary: 0.5,
      amplitude: [0, 20],
      waveLength: [30, 100],
    });

    // reflectionFilter.mirror = true;
    // reflectionFilter.boundary = 0.5;
    // reflectionFilter.amplitude = [0, 20];
    // reflectionFilter.waveLength = [30, 100];
    // reflectionFilter.alpha = [1, 1];


    sprite.filters = [reflectionFilter];

    const chkMirror = document.getElementById("chkMirror");
    const inpBoundary = document.getElementById("inpBoundary");
    const inpAmpStart = document.getElementById("inpAmpStart");
    const inpAmpEnd = document.getElementById("inpAmpEnd");
    const inpWaveStart = document.getElementById("inpWaveStart");
    const inpWaveEnd = document.getElementById("inpWaveEnd");
    const inpAlphaStart = document.getElementById("inpAlphaStart");
    const inpAlphaEnd = document.getElementById("inpAlphaEnd");

    const valMirror = chkMirror.nextElementSibling;
    const valBoundary = inpBoundary.nextElementSibling;
    const valAmpStart = inpAmpStart.nextElementSibling;
    const valAmpEnd = inpAmpEnd.nextElementSibling;
    const valWaveStart = inpWaveStart.nextElementSibling;
    const valWaveEnd = inpWaveEnd.nextElementSibling;
    const valAlphaStart = inpAlphaStart.nextElementSibling;
    const valAlphaEnd = inpAlphaEnd.nextElementSibling;

    // UI回显读取使用 *Start / *End
    chkMirror.checked = reflectionFilter.mirror;
    valMirror.textContent = String(reflectionFilter.mirror);

    inpBoundary.value = reflectionFilter.boundary;
    valBoundary.textContent = reflectionFilter.boundary.toFixed(2);

    inpAmpStart.value = reflectionFilter.amplitudeStart;
    valAmpStart.textContent = reflectionFilter.amplitudeStart.toFixed(2);
    inpAmpEnd.value = reflectionFilter.amplitudeEnd;
    valAmpEnd.textContent = reflectionFilter.amplitudeEnd.toFixed(2);

    inpWaveStart.value = reflectionFilter.wavelengthStart;
    valWaveStart.textContent = reflectionFilter.wavelengthStart;
    inpWaveEnd.value = reflectionFilter.wavelengthEnd;
    valWaveEnd.textContent = reflectionFilter.wavelengthEnd;

    inpAlphaStart.value = reflectionFilter.alphaStart;
    valAlphaStart.textContent = reflectionFilter.alphaStart.toFixed(2);
    inpAlphaEnd.value = reflectionFilter.alphaEnd;
    valAlphaEnd.textContent = reflectionFilter.alphaEnd.toFixed(2);


    chkMirror.onchange = () => {
      reflectionFilter.mirror = chkMirror.checked;
      valMirror.textContent = String(reflectionFilter.mirror);
    };

    inpBoundary.oninput = () => {
      reflectionFilter.boundary = Number(inpBoundary.value);
      valBoundary.textContent = reflectionFilter.boundary.toFixed(2);
    };

    // 滑块实时修改：全部使用单独 Start / End 属性赋值
    inpAmpStart.oninput = () => {
      reflectionFilter.amplitudeStart = Number(inpAmpStart.value);
      valAmpStart.textContent = reflectionFilter.amplitudeStart.toFixed(2);
    };
    inpAmpEnd.oninput = () => {
      reflectionFilter.amplitudeEnd = Number(inpAmpEnd.value);
      valAmpEnd.textContent = reflectionFilter.amplitudeEnd.toFixed(2);
    };

    inpWaveStart.oninput = () => {
      reflectionFilter.wavelengthStart = Number(inpWaveStart.value);
      valWaveStart.textContent = reflectionFilter.wavelengthStart;
    };
    inpWaveEnd.oninput = () => {
      reflectionFilter.wavelengthEnd = Number(inpWaveEnd.value);
      valWaveEnd.textContent = reflectionFilter.wavelengthEnd;
    };

    inpAlphaStart.oninput = () => {
      reflectionFilter.alphaStart = Number(inpAlphaStart.value);
      valAlphaStart.textContent = reflectionFilter.alphaStart.toFixed(2);
    };
    inpAlphaEnd.oninput = () => {
      reflectionFilter.alphaEnd = Number(inpAlphaEnd.value);
      valAlphaEnd.textContent = reflectionFilter.alphaEnd.toFixed(2);
    };

  </script>
</body>

</html>
