<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <style>
    .box {
      width: 80px;
      height: 80px;
      background: #4285f4;
      margin: 300px 0;
    }

    .space {
      height: 1200px;
    }
  </style>
  <!-- 引入gsap和ScrollTrigger插件 -->
  <script src="../js/gsap.min.js"></script>
  <script src="../js/ScrollTrigger.min.js"></script>
</head>

<body>
  <div class="space"></div>
  <div class="box"></div>
  <div class="space"></div>
  <script>
    // 注册插件
    gsap.registerPlugin(ScrollTrigger);

    gsap.to(".box", {
      x: 350,
      duration: 1,
      scrollTrigger: {
        trigger: ".box",
        start: "top 80%",
        end: "top 20%",
        scrub: true
      }
    });
  </script>
</body>

</html>
