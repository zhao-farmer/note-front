<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <style>
    .box {
      width: 80px;
      height: 80px;
      background: #4285f4;
      margin: 10px;
    }
  </style>
  <script src="../js/gsap.min.js"></script>
</head>

<body>
  <div class="box"></div>
  <button id="playBtn">播放 gsap.to 动画</button>
  <script>
    const box = document.querySelector(".box");
    document.querySelector("#playBtn").onclick = () => {
      gsap.killTweensOf(box);
      gsap.to(box, {
        x: 250,
        rotation: 180,
        duration: 1.2,
        ease: "power2.out"
      });
    }
  </script>
</body>

</html>
