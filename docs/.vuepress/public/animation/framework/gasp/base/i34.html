<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <style>
    body {
      height: 200vh;
      margin: 0;
    }

    .box {
      width: 80px;
      height: 80px;
      background: #4285f4;
      margin-top: 60vh;
    }

    .log {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 8px;
    }
  </style>
  <!-- 引入 gsap + scrollTrigger -->
  <script src="../js/gsap.min.js"></script>
  <script src="../js/ScrollTrigger.min.js"></script>
</head>

<body>
  <div class="log">st.progress: <span id="stVal">0</span></div>
  <div class="log">tween.progress: <span id="tweenVal">0</span></div>
  <div class="box"></div>

  <script>
    const box = document.querySelector(".box");
    const stDom = document.querySelector("#stVal");
    const tweenDom = document.querySelector("#tweenVal");

    const tween = gsap.to(box, {
      x: 400,
      duration: 1,
      scrollTrigger: {
        trigger: box,
        start: "top 80%",
        end: "top 20%",
        scrub: true
      }
    });

    gsap.ticker.add(() => {
      const st = tween.scrollTrigger;
      if (!st) return;
      stDom.textContent = st.progress.toFixed(3);
      tweenDom.textContent = tween.progress().toFixed(3);
    })
  </script>
</body>

</html>
