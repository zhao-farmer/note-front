<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>GSAP 2D Transform Demo</title>
  <style>
    .box2d {
      width: 120px;
      height: 120px;
      background: #4285f4;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>

<body>
  <div class="box2d">2D盒子</div>
  <button onclick="run2DAnim()">播放2D动画</button>

  <script src="../js/gsap.min.js"></script>
  <script>
    const box2d = document.querySelector('.box2d');

    function run2DAnim() {
      gsap.to(box2d, {
        duration: 2,
        rotation: 360, // rotation = rotationZ
        scaleX: 0.8,
        transformOrigin: "left top", // 变换原点：左上角
        force3D: "auto",
        ease: "power2.out"
      })
    }
  </script>
</body>

</html>
