<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>PixelateFilter 像素马赛克滤镜</title>
  <script src="./js/pixi.js"></script>
  <script src="./js/pixi-filters.js"></script>
  <style>
    .wrap {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }
    .panel {
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid #ccc;
      padding: 14px;
      border-radius: 6px;
    }
    canvas{
      border: 1px solid #ccc;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    label {
      width: 140px;
      font-size: 14px;
    }
    input[type="range"] {
      flex:1;
    }
    .val{
      width:70px;
      text-align:right;
      font-size:13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="canvasWrap"></div>
    <div class="panel">
      <div class="row">
        <label>size.x 横向块大小</label>
        <input type="range" min="4" max="40" step="0.01" id="inpSizeX">
        <span class="val">4</span>
      </div>
      <div class="row">
        <label>size.y 纵向块大小</label>
        <input type="range" min="4" max="40" step="0.01" id="inpSizeY">
        <span class="val">4</span>
      </div>
      <div style="font-size:12px;color:#555;">
        PixelateFilter：像素马赛克滤镜<br/>
        size 为float数组 [x,y]，取值区间4‑40；使用精灵Sprite图片
      </div>
    </div>
  </div>
  <script type="module">
    const app = new PIXI.Application();
    await app.init({
      width: 345,
      height: 460,
      backgroundColor: 0xffffff
    });
    document.querySelector('#canvasWrap').appendChild(app.canvas);

    // 精灵图片
    const tex = await PIXI.Assets.load('./image/01.jpg');
    const sprite = PIXI.Sprite.from(tex);
    sprite.scale.set(0.5);
    app.stage.addChild(sprite);

    // size 使用float数组 [x, y]，初始值和截图保持
    const pixelateFilter = new PIXI.filters.PixelateFilter();
    pixelateFilter.size = [4, 4];
    sprite.filters = [pixelateFilter];

    const inpSizeX = document.getElementById('inpSizeX');
    const inpSizeY = document.getElementById('inpSizeY');
    const valSizeX = inpSizeX.nextElementSibling;
    const valSizeY = inpSizeY.nextElementSibling;

    //初始化控件
    inpSizeX.value = pixelateFilter.size[0];
    valSizeX.textContent = pixelateFilter.size[0].toFixed(2);
    inpSizeY.value = pixelateFilter.size[1];
    valSizeY.textContent = pixelateFilter.size[1].toFixed(2);

    inpSizeX.oninput = ()=>{
      pixelateFilter.size[0] = Number(inpSizeX.value);
      valSizeX.textContent = pixelateFilter.size[0].toFixed(2);
    };
    inpSizeY.oninput = ()=>{
      pixelateFilter.size[1] = Number(inpSizeY.value);
      valSizeY.textContent = pixelateFilter.size[1].toFixed(2);
    };
  </script>
</body>
</html>
