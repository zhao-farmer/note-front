<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>RadialBlurFilter 径向模糊滤镜</title>
  <script src="./js/pixi.js"></script>
  <script src="./js/pixi-filters.js"></script>
  <style>
    .wrap {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }
    .panel {
      width: 340px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid #ccc;
      padding:14px;
      border-radius:6px;
    }
    canvas{
      border:1px solid #ccc;
    }
    .row{
      display:flex;
      gap:8px;
      align-items:center;
    }
    label{
      width:130px;
      font-size:14px;
    }
    input[type="range"]{
      flex:1;
    }
    .val{
      width:80px;
      text-align:right;
      font-size:13px;
    }
  </style>
</head>
<body>
<div class="wrap">
  <div id="canvasWrap"></div>
  <div class="panel">
    <div class="row">
      <label>angle 旋转角度</label>
      <input type="range" min="0" max="120" step="0.1" id="inpAngle">
      <span class="val">20.00</span>
    </div>
    <div class="row">
      <label>center.x 中心点X</label>
      <input type="range" min="0" max="463" step="1" id="inpCx">
      <span class="val">172.00</span>
    </div>
    <div class="row">
      <label>center.y 中心点Y</label>
      <input type="range" min="0" max="460" step="0.5" id="inpCy">
      <span class="val">230.00</span>
    </div>
    <div class="row">
      <label>radius 作用半径</label>
      <input type="range" min="-1" max="500" step="1" id="inpRadius">
      <span class="val">50.00</span>
    </div>
    <div class="row">
      <label>kernelSize 卷积核</label>
      <input type="range" min="3" max="25" step="2" id="inpKernel">
      <span class="val">15</span>
    </div>
    <div style="font-size:12px;color:#555;">
      RadialBlurFilter：径向放射旋转模糊；使用精灵Sprite图片<br/>
      kernelSize 必须为奇数；radius=-1代表无限半径全局生效
    </div>
  </div>
</div>

<script type="module">
  const app = new PIXI.Application();
  await app.init({
    width: 345,
    height: 460,
    backgroundColor:0xffffff
  });
  document.querySelector("#canvasWrap").appendChild(app.canvas);

  //加载精灵图片
  const tex = await PIXI.Assets.load("./image/01.jpg");
  const sprite = PIXI.Sprite.from(tex);
  sprite.scale.set(0.5);
  app.stage.addChild(sprite);

  //截图原始参数 angle=20，center=[960,536.5], radius=300, kernelSize=15
  const radialBlurFilter = new PIXI.filters.RadialBlurFilter();
  radialBlurFilter.angle = 20;
  radialBlurFilter.center = [172, 230];
  radialBlurFilter.radius = 50;
  radialBlurFilter.kernelSize = 15;

  sprite.filters = [radialBlurFilter];

  const inpAngle = document.getElementById("inpAngle");
  const inpCx = document.getElementById("inpCx");
  const inpCy = document.getElementById("inpCy");
  const inpRadius = document.getElementById("inpRadius");
  const inpKernel = document.getElementById("inpKernel");

  const valAngle = inpAngle.nextElementSibling;
  const valCx = inpCx.nextElementSibling;
  const valCy = inpCy.nextElementSibling;
  const valRadius = inpRadius.nextElementSibling;
  const valKernel = inpKernel.nextElementSibling;

  //初始化滑块
  inpAngle.value = radialBlurFilter.angle;
  valAngle.textContent = radialBlurFilter.angle.toFixed(2);

  console.log(radialBlurFilter)
  console.log(radialBlurFilter.center);

  inpCx.value = radialBlurFilter.center.x;
  valCx.textContent = radialBlurFilter.center.x.toFixed(2);

  inpCy.value = radialBlurFilter.center.y;
  valCy.textContent = radialBlurFilter.center.y.toFixed(2);

  inpRadius.value = radialBlurFilter.radius;
  valRadius.textContent = radialBlurFilter.radius.toFixed(2);

  inpKernel.value = radialBlurFilter.kernelSize;
  valKernel.textContent = radialBlurFilter.kernelSize;


  inpAngle.oninput = ()=>{
    radialBlurFilter.angle = Number(inpAngle.value);
    valAngle.textContent = radialBlurFilter.angle.toFixed(2);
  };

  inpCx.oninput = ()=>{
    radialBlurFilter.center[0] = Number(inpCx.value);
    valCx.textContent = radialBlurFilter.center[0].toFixed(2);
  };

  inpCy.oninput = ()=>{
    radialBlurFilter.center[1] = Number(inpCy.value);
    valCy.textContent = radialBlurFilter.center[1].toFixed(2);
  };

  inpRadius.oninput = ()=>{
    radialBlurFilter.radius = Number(inpRadius.value);
    valRadius.textContent = radialBlurFilter.radius.toFixed(2);
  };

  inpKernel.oninput = ()=>{
    radialBlurFilter.kernelSize = Number(inpKernel.value);
    valKernel.textContent = radialBlurFilter.kernelSize;
  };
</script>
</body>
</html>
