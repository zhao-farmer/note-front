<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>SimpleLightmapFilter 光照贴图滤镜</title>
  <script src="./js/pixi.js"></script>
  <script src="./js/pixi-filters.js"></script>
  <style>
    .wrap {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .panel {
      width: 340px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid #ccc;
      padding: 14px;
      border-radius: 6px;
    }

    canvas {
      border: 1px solid #ccc;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    label {
      width: 130px;
      font-size: 14px;
    }

    input[type="range"] {
      flex: 1;
    }

    .val {
      width: 80px;
      text-align: right;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div id="canvasWrap"></div>
    <div class="panel">
      <div class="row">
        <label>color 环境色</label>
        <input type="color" id="inpColor" value="#666666">
        <span class="val">#666666</span>
      </div>
      <div class="row">
        <label>alpha 强度</label>
        <input type="range" min="0" max="1" step="0.01" id="inpAlpha">
        <span class="val">1.00</span>
      </div>
      <div style="font-size:12px;color:#555;">
        SimpleLightmapFilter<br />
        lightMap由内置Canvas生成径向渐变；color使用color输入框；dontFit=true
      </div>
    </div>
  </div>
  <script type="module">
    // 1. 生成lightmap贴图 canvas，输出PIXI.Texture
    function createLightmapTexture(width = 512, height = 512) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      // 径向渐变：中心白，边缘黑（探照灯样式lightmap）
      const grad = ctx.createRadialGradient(
        width * 0.5, height * 0.5, 0,
        width * 0.5, height * 0.5, width * 0.45
      );
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(1, '#000000');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);
      return PIXI.Texture.from(canvas);
    }

    // hex颜色转 [r,g,b] 0‑1数组
    function hexToRgb01(hex) {
      const h = hex.replace('#', '');
      const r = parseInt(h.substring(0, 2), 16) / 255;
      const g = parseInt(h.substring(2, 4), 16) / 255;
      const b = parseInt(h.substring(4, 6), 16) / 255;
      return [r, g, b];
    }

    const app = new PIXI.Application();
    await app.init({
      width: 345,
      height: 460,
      backgroundColor: 0x000000
    });
    document.querySelector("#canvasWrap").appendChild(app.canvas);

    const tex = await PIXI.Assets.load("./image/01.jpg");
    const lightMapTex = createLightmapTexture();

    const sprite = PIXI.Sprite.from(tex);
    sprite.scale.set(0.5);
    app.stage.addChild(sprite);

    const simpleLightmapFilter = new PIXI.filters.SimpleLightmapFilter({
      lightMap: lightMapTex,
      color: hexToRgb01("#666666"),
      alpha: 1.0
    });
    simpleLightmapFilter.dontFit = true;
    sprite.filters = [simpleLightmapFilter];

    const inpColor = document.getElementById("inpColor");
    const inpAlpha = document.getElementById("inpAlpha");
    const valColor = inpColor.nextElementSibling;
    const valAlpha = inpAlpha.nextElementSibling;

    inpColor.value = "#666666";
    valColor.textContent = "#666666";
    inpAlpha.value = simpleLightmapFilter.alpha;
    valAlpha.textContent = simpleLightmapFilter.alpha.toFixed(2);

    function syncParams() {
      const hex = inpColor.value;
      simpleLightmapFilter.color = hexToRgb01(hex);
      simpleLightmapFilter.alpha = Number(inpAlpha.value);

      valColor.textContent = hex;
      valAlpha.textContent = Number(inpAlpha.value).toFixed(2);
    }

    inpColor.oninput = syncParams;
    inpAlpha.oninput = syncParams;


  </script>
</body>

</html>
