<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>视频源-VideoSampleSource</title>
</head>

<body>
  <video id="player" controls height="320" style="margin-top:20px"></video>
  <pre id="output"></pre>

  <script type="module">
    import {
      Input,
      ALL_FORMATS,
      UrlSource,
      VideoSample,
      VideoSampleSink,
      Output,
      Mp4OutputFormat,
      VideoSampleSource,
      BufferTarget
    } from "../js/mediabunny.1.42.mjs";

    const outputEl = document.getElementById('output');
    const log = (msg) => outputEl.textContent += msg + '\n';

    // 测试视频
    const VIDEO_URL = "../media/01.mp4";

    (async () => {
      try {
        log("1. 创建 编码器");
        const output = new Output({
          format: new Mp4OutputFormat(),
          target: new BufferTarget(),
        });

        log("2. 添加轨道");
        const videoSampleSource = new VideoSampleSource({ 
          codec: "avc", 
          bitrate: 1e6, // 1 Mbps	
          sizeChangeBehavior: "cover", // 保持视频比例适配屏幕
        });
        output.addVideoTrack(videoSampleSource);

        log("3. 启动编码器...");
        await output.start();

        log("4. 写入数据包");

        log("4.1 添加2秒图片数据");
        // 通过外部直接获取图片
        const img = new Image();
        img.src = "../media/02.jpg";

        await new Promise((resolve) => {
          img.onload = () => {
            console.log("图片加载成功");
            resolve();
          };
          img.onerror = () => {
            console.log("图片加载失败");
            resolve();
          };
        });
        const imageSample = new VideoSample(img, { 
          timestamp: 0.0, // 开始时间戳 
          duration: 2,  // 持续时间
        });
        await videoSampleSource.add(imageSample);
        imageSample.close();

        log("4.2 添加视频2-5秒数据");
        const input = new Input({
          formats: ALL_FORMATS,
          source: new UrlSource(VIDEO_URL)
        });
        const videoTrack = await input.getPrimaryVideoTrack();
        const videoSink = new VideoSampleSink(videoTrack);

        // 前5秒的视频
        for await (const sample of videoSink.samples(2, 5)) {
          await videoSampleSource.add(sample);
          sample.close();
        }

        log("5. 完成编码...");
        await output.finalize();

        log("6. 资源使用\n");
        const arrayBuffer = output.target.buffer;
        const blobResult = new Blob([arrayBuffer], { type: "video/mp4" });
        const url = URL.createObjectURL(blobResult);
        player.src = url;

        player.addEventListener("loadedmetadata", () => {
          log(`播放器加载成功！视频时长: ${player.duration.toFixed(2)}s`);
        });

        log("全部流程执行完成！");

        // 释放input
        input.dispose();

      } catch (err) {
        log("错误：" + err.message);
        console.error(err);
      }
    })();
  </script>
</body>
</html>
