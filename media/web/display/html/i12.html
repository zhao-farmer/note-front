<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>PIXI Video 播放控制</title>
  <script src="./js/pixi.js"></script>
</head>

<body>
  <div style="position:fixed; top:10px; left:10px; display:grid; gap:6px;">
    <button onclick="play()">播放</button>
    <button onclick="pause()">暂停</button>
    <button onclick="stop()">停止（回到开头）</button>
    <button onclick="speedUp()">加速 ×1.2</button>
    <button onclick="speedDown()">减速 ×0.8</button>
    <button onclick="normalSpeed()">恢复正常速度</button>
    <button onclick="volumeUp()">音量+</button>
    <button onclick="volumeDown()">音量-</button>
    <button onclick="toggleMute()">静音切换</button>
    <button onclick="jumpTo5s()">跳转到 5 秒</button>
    <button onclick="toggleFullScreen()">全屏</button>
  </div>

  <script>
    let app, video, sprite;

    (async () => {
      app = new PIXI.Application();
      await app.init({ width: 800, height: 600, backgroundColor: 0x222222 });
      document.body.appendChild(app.canvas);

      const videoTexture = await PIXI.Assets.load('./video/demo.mp4');
      console.log(videoTexture);

      video = videoTexture.source.resource;

      sprite = new PIXI.Sprite(videoTexture);
      sprite.anchor.set(0.5);
      sprite.x = app.screen.width / 2;
      sprite.y = app.screen.height / 2;
      sprite.scale.set(0.7);
      app.stage.addChild(sprite);

      // 默认配置
      video.loop = true;
      video.volume = 0.7;
      video.play();


      // ===== 播放控制函数（超级全）=====
      window.play = () => video.play();
      window.pause = () => video.pause();
      window.stop = () => { video.pause(); video.currentTime = 0; };
      window.speedUp = () => video.playbackRate *= 1.2;
      window.speedDown = () => video.playbackRate *= 0.8;
      window.normalSpeed = () => video.playbackRate = 1;
      window.volumeUp = () => video.volume = Math.min(1, video.volume + 0.1);
      window.volumeDown = () => video.volume = Math.max(0, video.volume - 0.1);
      window.toggleMute = () => video.muted = !video.muted;
      window.jumpTo5s = () => video.currentTime = 5;
      window.toggleFullScreen = () => {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else {
          app.canvas.requestFullscreen();
        }
      };


      // 视频所有监听事件（完整版）
      video.addEventListener('play', () => {
        console.log('▶ 开始播放');
      });
      video.addEventListener('pause', () => {
        console.log('⏸ 暂停');
      });
      video.addEventListener('ended', () => {
        console.log(' 播放结束');
      });
      video.addEventListener('timeupdate', () => {
        console.log('当前时间：', video.currentTime.toFixed(1));
      });
      video.addEventListener('volumechange', () => {
        console.log('音量变化：', video.volume);
      });
      video.addEventListener('ratechange', () => {
        console.log('倍速变化：', video.playbackRate);
      });
      video.addEventListener('waiting', () => {
        console.log('缓冲中...');
      });
      video.addEventListener('playing', () => {
        console.log('▶ 正在播放');
      });
      video.addEventListener('error', (e) => {
        console.error('视频加载错误：', e);
      });


      // ========== 视频所有属性 ==========
      console.log('===== 视频基础信息 =====');
      console.log('总时长(s):', video.duration);
      console.log('宽度:', video.videoWidth);
      console.log('高度:', video.videoHeight);
      console.log('URL:', video.currentSrc);

      console.log('===== 播放状态 =====');
      console.log('是否正在播放:', !video.paused);
      console.log('是否已结束:', video.ended);
      console.log('是否循环:', video.loop);
      console.log('是否静音:', video.muted);

      console.log('===== 播放控制 =====');
      console.log('当前音量:', video.volume);
      console.log('播放倍速:', video.playbackRate);
      console.log('当前时间:', video.currentTime);
    })();
  </script>
</body>

</html>
